# @package experiment.config.logging

# DETAILED-level logging through the NpzHandler: the same per-episode
# stats DetailedJSONHandler writes, as telemetry/episode_NNNNNN.npz (the
# stats as JSON in one member, every array as a member of its own), with
# path filters (include / exclude) over the stats. The filter keys live at
# this level so they can be overridden from the command line, e.g.
# ``+experiment.config.logging.exclude=[attention_system/goals]``.
python_log_level: DEBUG
python_log_to_file: true
python_log_to_stderr: true
output_dir: ${path.expanduser:${oc.env:MONTY_LOGS}/projects/monty_runs/}

# Global episode ids to save; null or [] saves every episode.
episodes: null
include: []
exclude:
- SM_*/raw_observations/*/sensor_frame_data
- SM_*/raw_observations/*/cam_to_world
float_dtype: float32

monty_data_logger:
  _target_: tbp.monty.frameworks.loggers.graph_matching_loggers.DetailedGraphMatchingLogger
  handlers:
    - _target_: tbp.monty.frameworks.loggers.monty_handlers.BasicCSVStatsHandler
    - _target_: tbp.monty.frameworks.loggers.npz_handler.NpzHandler
      episodes: ${experiment.config.logging.episodes}
      include: ${experiment.config.logging.include}
      exclude: ${experiment.config.logging.exclude}
      float_dtype: ${experiment.config.logging.float_dtype}
