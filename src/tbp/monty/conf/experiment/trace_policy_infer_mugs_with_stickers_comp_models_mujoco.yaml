# @package _global_

# Inference on the four mug variants (at random rotations) with LM_2 using the
# TraceGoalGenerator, which moves the sensor to the maximal hot spot of the most
# likely object. Loads the hot spots learned by
# post_training_hotspots_objects_with_stickers_comp_models_mujoco.

defaults:
  - /monty: evidencegraph_exp1000_emin_t3
  - /monty/motor_system_config: distant_5
  - /monty/learning_module: evidence_3lm_heterarchy
  - /monty/sensor_module: 3sm_2d3d_dist_slic
  - /monty/connectivity: 3lm_3sm_heterarchy
  - /monty/attention_system: default
  - /environment: mujoco_dist_agent_sensors3_256
  - /env_interface: eval_mugs_with_stickers_randrot
  - /env_interface/positioning_procedures_eval: getgoodview_viewfinder_patch0
  - /env_interface/transform: gaussianblur_missing_depthto3d_sensor4_256
  - /logging: basic_info_evidence_eval_runs

experiment:
  _target_: tbp.monty.frameworks.experiments.object_recognition_experiments.MontyObjectRecognitionExperiment
  config:
    show_sensor_output: false
    max_train_steps: 1000
    max_eval_steps: 250
    max_total_steps: 500
    n_train_epochs: 3
    n_eval_epochs: 2
    model_name_or_path: ${path.expanduser:'~/tbp/results/comp_benefits_figures/post_training_hotspots_objects_with_stickers_comp_models_mujoco/0'}
    match_criterion:
      _target_: tbp.monty.experiment.match_criteria.NamedLMsMatch
      ids:
        - learning_module_2
    seed: 1337
    supervised_lm_ids: []
    python_log_level: INFO
    logging:
      python_log_level: INFO
      run_name: trace_policy_infer_mugs_with_stickers_comp_models_mujoco
      output_dir: ${path.expanduser:'~/tbp/results/comp_benefits_figures'}
    monty_config:
      monty_args:
        min_eval_steps: ${constants.min_eval_steps}
      motor_system_config:
        telemetry:
          _target_: tbp.monty.frameworks.models.motor_system_telemetry.NoopMotorSystemTelemetry
      learning_modules:
        learning_module_0:
          # When recognizing compositional object, LM_2 is prioritized over LM_0
          gsg: null
        learning_module_1:
          gsg: null
          # Lower the threshold for passing object IDs during inference
          output_min_evidence: 5.0
        learning_module_2:
          region_proposers:
            - _target_: tbp.monty.frameworks.models.evidence_matching.region_proposal.excite_goal_locations.ExciteGoalLocations
          telemetry:
            _target_: tbp.monty.frameworks.models.evidence_matching.telemetry.NoopEvidenceGraphLMTelemetry
          gsg:
            # Keys of the default EvidenceGoalGenerator config that the
            # TraceGoalGenerator does not use are ignored.
            _target_: tbp.monty.frameworks.models.goal_generation.TraceGoalGenerator
            min_steps_between_goals: 10
            min_hotspot_value: 0.0
      sensor_modules:
        sensor_module_0:
          region_proposers:
            - _target_: tbp.monty.frameworks.models.sm_region_proposal.excite_goal_locations.ExciteGoalLocations
        sensor_module_3:
          segmentation_strategy:
            _target_: tbp.monty.frameworks.models.salience.segmentation.strategies.slic_merge.SlicMerge
          snapshot_telemetry:
            _target_: tbp.monty.frameworks.models.salience.telemetry.NoopSalienceSMTelemetry
      attention_system:
        telemetry:
          _target_: tbp.monty.attention.telemetry.NoopAttentionSystemTelemetry
