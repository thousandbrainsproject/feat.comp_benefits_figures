# @package _global_

defaults:
  - /monty: evidencegraph_exp1000_e3_t3_tot2500
  - /monty/motor_system_config: naive_scan_5
  - /monty/learning_module: evidence_3lm_heterarchy
  - /monty/sensor_module: 3sm_2d3d_dist_slic
  - /monty/connectivity: 3lm_3sm_heterarchy
  - /monty/attention_system: inhibition_flip
  - /environment: mujoco_dist_agent_sensors3_256
  - /env_interface: train_cube_cylinder_with_stickers_predefined
  - /env_interface/positioning_procedures_train: getgoodview_viewfinder_patch0
  - /env_interface/transform: gaussianblur_missing_depthto3d_sensor4_256
  - /logging: silent_info_train

# Stage 3 of the cube/cylinder 3LM chain: LM_2 learns every sticker x {cube, cylinder} composite.
# Trains with the attention pipeline of debug/debug_inhibition_flip: the SLIC
# salience SM, the inhibition-flip attention system, and the same LM region
# proposers -- but no goal state generators.
experiment:
  _target_: tbp.monty.frameworks.experiments.pretraining_experiments.MontySupervisedObjectPretrainingExperiment
  config:
    show_sensor_output: false
    max_train_steps: 1000
    max_eval_steps: 500
    max_total_steps: 6000
    n_train_epochs: ${constants.rotations_all_count}
    n_eval_epochs: 3
    model_name_or_path: ${path.expanduser:${oc.env:MONTY_MODELS}/my_trained_models/supervised_pre_training_cube_cylinder_2d_children_3lm_mujoco/pretrained/}
    match_criterion:
      _target_: tbp.monty.experiment.match_criteria.AnyLMsMatch
      count: 3
    seed: 42
    supervised_lm_ids:
      - learning_module_2
    logging:
      run_name: supervised_pre_training_cube_cylinder_comp_models_3lm_mujoco
    monty_config:
      learning_modules:
        learning_module_0:
          region_proposers:
            - _target_: tbp.monty.frameworks.models.evidence_matching.region_proposal.excite_goal_locations.ExciteGoalLocations
          gsg: null
        learning_module_1:
          region_proposers:
            - _target_: tbp.monty.frameworks.models.evidence_matching.region_proposal.inhibit_all_on_recognition.InhibitAllOnRecognition
          gsg: null
        learning_module_2:
          region_proposers:
            - _target_: tbp.monty.frameworks.models.evidence_matching.region_proposal.excite_goal_locations.ExciteGoalLocations
          gsg: null
