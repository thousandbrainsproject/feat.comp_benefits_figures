# @package _global_

defaults:
  - /monty: evidencegraph_exp1000_emin_t3_tot2500
  - /monty/motor_system_config: distant_5
  - /monty/learning_module: evidence_3lm_heterarchy
  - /monty/sensor_module: 3sm_2d3d_dist_slic
  - /monty/connectivity: 3lm_3sm_heterarchy
  - /monty/attention_system: inhibition_flip
  - /environment: mujoco_dist_agent_sensors3_256
  - /env_interface: eval_objects_with_stickers_predefined
  - /env_interface/positioning_procedures_eval: getgoodview_viewfinder_patch0
  - /env_interface/transform: gaussianblur_missing_depthto3d_sensor4_256
  - /logging: telemetry_detailed

# debug_3lm with the inhibition-flip attention system: no decay, and the
# sticker LM's recognition flips the whole remembered grid to inhibition
# (/monty/attention_system: inhibition_flip).
experiment:
  _target_: tbp.monty.frameworks.experiments.object_recognition_experiments.MontyObjectRecognitionExperiment
  config:
    show_sensor_output: false
    max_train_steps: 1000
    max_eval_steps: 100
    max_total_steps: 150
    n_train_epochs: 3
    n_eval_epochs: 1
    model_name_or_path: ${path.expanduser:${oc.env:MONTY_MODELS}/my_trained_models/supervised_pre_training_objects_with_stickers_comp_models_3lm/pretrained/}
    match_criterion:
      _target_: tbp.monty.experiment.match_criteria.NamedLMsMatch
      ids:
        - learning_module_2
    seed: 42
    supervised_lm_ids: []
    python_log_level: DEBUG
    eval_env_interface_args:
      object_names:
        - 002_cube_tbp
      object_init_sampler:
        _target_: tbp.monty.frameworks.environments.object_init_samplers.Predefined
        rotations:
        - - 0.0
          - 0.0
          - 0.0
    logging:
      run_name: debug_inhibition_flip
      output_dir: ${path.expanduser:'~/tbp/results/comp_benefits_figures'}
      exclude:
        - SM_[01]/raw_observations
        - SM_*/raw_observations/*/sensor_frame_data
        - SM_*/raw_observations/*/cam_to_world
    monty_config:
      motor_system_config:
        telemetry:
          _target_: tbp.monty.frameworks.models.motor_system_telemetry.MotorSystemTelemetry
      learning_modules:
        learning_module_0:
          # Hair-trigger recognition so InhibitRecognizedObject fires in this
          # short debug episode; cube/disk/cylinder evidences run within ~1-4%
          # of each other on the shared surface.
          x_percent_threshold: 10
          region_proposers:
            - _target_: tbp.monty.frameworks.models.evidence_matching.region_proposal.excite_goal_locations.ExciteGoalLocations
          telemetry:
            _target_: tbp.monty.frameworks.models.evidence_matching.telemetry.EvidenceGraphLMTelemetry
          gsg:
            # Require at least 50 steps to elapse before the GSG will consider
            # outputting a hypothesis-testing goal.
            min_post_goal_success_steps: 20
        learning_module_1:
          # The sticker LM is the one that recognizes in this episode. It
          # sends only the inhibit-all signal that flips the grid, no
          # locations: its shell proposals landed hundreds of meters off
          # whenever its pose estimate slipped.
          region_proposers:
            - _target_: tbp.monty.frameworks.models.evidence_matching.region_proposal.inhibit_all_on_recognition.InhibitAllOnRecognition
          telemetry:
            _target_: tbp.monty.frameworks.models.evidence_matching.telemetry.EvidenceGraphLMTelemetry
          # Only LM_0 generates goals; disable the goal generators of LM_1/LM_2.
          gsg: null
        learning_module_2:
          x_percent_threshold: 10
          region_proposers:
            - _target_: tbp.monty.frameworks.models.evidence_matching.region_proposal.excite_goal_locations.ExciteGoalLocations
          telemetry:
            _target_: tbp.monty.frameworks.models.evidence_matching.telemetry.EvidenceGraphLMTelemetry
          # Only LM_0 generates goals; disable the goal generators of LM_1/LM_2.
          gsg: null
      sensor_modules:
        sensor_module_3:
          save_raw_obs: true
          segmentation_strategy:
            _target_: tbp.monty.frameworks.models.salience.segmentation.strategies.slic_merge.SlicMerge

