# @package _global_

# Post-training unsupervised learning of hot spots on the compositional models of the
# four mug variants. LM_2 explores each mug from the 14 views onto the faces and
# corners of a cube around it (50 matching steps per view, 700 in total), traces its
# most likely hypothesis and, if it converged, tags the locations that distinguished
# the recognized mug from the others as hot spots on that mug's model. The model
# saved at the end of each epoch (in output_dir/run_name/0/model.pt) carries the hot
# spots. The per-step history of each trace is saved to
# output_dir/run_name/hypothesis_traces for diagnostics.

defaults:
  - /monty: evidencegraph_exp1000_emin_t3
  - /monty/motor_system_config: distant_5
  - /monty/learning_module: evidence_3lm_heterarchy
  - /monty/sensor_module: 3sm_2d3d_dist_slic
  - /monty/connectivity: 3lm_3sm_heterarchy
  - /monty/attention_system: default
  - /environment: mujoco_dist_agent_sensors3_256
  - /env_interface: post_train_mugs_with_stickers_predefined
  - /env_interface/positioning_procedures_eval: getgoodview_viewfinder_patch0
  - /env_interface/transform: gaussianblur_missing_depthto3d_sensor4_256
  - /logging: basic_info_evidence_eval_runs

experiment:
  _target_: tbp.monty.frameworks.experiments.object_recognition_experiments.MontyObjectRecognitionExperiment
  config:
    show_sensor_output: false
    max_train_steps: 1000
    # LM_2 processes only a subset of Monty's matching steps (under half with the
    # current inhibition of return), so these exceed the 750 (initial view + 14
    # views x 50) LM_2 matching steps of the exploration policy.
    max_eval_steps: 2500
    max_total_steps: 3000
    n_train_epochs: 3
    n_eval_epochs: 1
    n_post_training_unsupervised_epochs: ${constants.rotations_all_count}
    model_name_or_path: ${path.expanduser:${oc.env:MONTY_MODELS}/my_trained_models/supervised_pre_training_objects_with_stickers_comp_models_mujoco/pretrained/}
    # Episodes run through all views (max_eval_steps), even once LM_2 has
    # converged.
    match_criterion:
      _target_: tbp.monty.experiment.match_criteria.NeverMatch
    seed: 42
    supervised_lm_ids: []
    python_log_level: INFO
    logging:
      python_log_level: INFO
      run_name: post_training_hotspots_objects_with_stickers_comp_models_mujoco
      output_dir: ${path.expanduser:'~/tbp/results/comp_benefits_figures'}
    monty_config:
      monty_args:
        # LMs only update their terminal states (and so only pass object IDs up
        # the hierarchy) after min_eval_steps.
        min_eval_steps: 10
      motor_system_config:
        telemetry:
          _target_: tbp.monty.frameworks.models.motor_system_telemetry.NoopMotorSystemTelemetry
      learning_modules:
        learning_module_0:
          # When recognizing compositional object, LM_2 is prioritized over LM_0
          gsg: null
        learning_module_1:
          gsg: null
          # Lower the threshold for passing object IDs during inference
          output_min_evidence: 5.0
        learning_module_2:
          region_proposers:
            - _target_: tbp.monty.frameworks.models.evidence_matching.region_proposal.excite_goal_locations.ExciteGoalLocations
          telemetry:
            _target_: tbp.monty.frameworks.models.evidence_matching.telemetry.NoopEvidenceGraphLMTelemetry
          gsg:
            # Keys of the default EvidenceGoalGenerator config that the
            # CubeViewGoalGenerator does not use are ignored.
            _target_: tbp.monty.frameworks.models.goal_generation.CubeViewGoalGenerator
            steps_per_view: 50
          hypothesis_tracer:
            _target_: tbp.monty.frameworks.models.evidence_matching.hypothesis_trace.HypothesisTracer
            num_recent_locations: 30
            location_eta: 0.01
            rotation_eta_degrees: 10.0
            history_dir: ~/tbp/results/comp_benefits_figures/post_training_hotspots_objects_with_stickers_comp_models_mujoco/hypothesis_traces
      sensor_modules:
        sensor_module_0:
          region_proposers:
            - _target_: tbp.monty.frameworks.models.sm_region_proposal.excite_goal_locations.ExciteGoalLocations
        sensor_module_3:
          segmentation_strategy:
            _target_: tbp.monty.frameworks.models.salience.segmentation.strategies.slic_merge.SlicMerge
          snapshot_telemetry:
            _target_: tbp.monty.frameworks.models.salience.telemetry.SalienceSMTelemetry
      attention_system:
        telemetry:
          _target_: tbp.monty.attention.telemetry.NoopAttentionSystemTelemetry
